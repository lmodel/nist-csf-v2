name: nist_csf_v2
annotations:
  cprt_framework_version:
    tag: cprt_framework_version
    value: CSF_2_0_0
  publication_date:
    tag: publication_date
    value: 2024-02
  oscal_content_tag:
    tag: oscal_content_tag
    value: v1.6.0
  oscal_content_commit:
    tag: oscal_content_commit
    value: f0de6d8d8c059d374f15e0ae07508d82e370fc1d
description: 'A LinkML model of the Cybersecurity Framework (CSF) 2.0, which NIST
  publishes as Cybersecurity White Paper (CSWP) 29: its six functions, their categories
  and subcategories, the implementation examples NIST publishes with the subcategories,
  and the CSF 1.1 categories and subcategories that CSF 2.0 withdrew, each with its
  status and, where NIST recorded it, where it moved or what incorporated it.'
title: The NIST Cybersecurity Framework (CSF) 2.0
comments:
- The version is the CSF edition that CSWP 29 defines, and source is the publication's
  digital object identifier. NIST's Cybersecurity and Privacy Reference Tool names
  the same edition CSF_2_0_0, and the catalog NIST publishes for it in usnistgov/oscal-content
  is copied to src/nist_csf_v2/schema/oscal-content/ at the tag and commit in the
  annotations. That catalog carries a version number of its own, 1.2.1, which numbers
  the catalog and not the framework. The release tags are the schema's own versions,
  and scripts/check_upstream_release.py reads the same pins and reports when NIST
  publishes another edition or changes the catalog.
- CSWP 29 is a work of the United States Government and is not subject to copyright
  in the United States. The descriptions here are this project's own words; NIST's
  text of each function, category, subcategory and example stays in the catalog copy.
- NIST's catalog renders each function as an OSCAL group, each category and subcategory
  as an OSCAL control and each implementation example as a part. The broad_mappings
  name those lmodel/oscal classes. A withdrawn category or subcategory is a control
  with a status property and links to where it moved or what incorporated it; the
  schema carries those as the element's status and identifiers.
- The catalog also marks most CSF 2.0 subcategories as first-party risk, third-party
  risk or both, in a marking property of class risk-party. CSWP 29 carries no such
  marking, so it is the reference tool's and the schema leaves it out.
source: https://doi.org/10.6028/NIST.CSWP.29
see_also:
- https://lmodel.github.io/nist-csf-v2
- https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
- https://www.nist.gov/cyberframework
- https://github.com/usnistgov/oscal-content/tree/v1.6.0/nist.gov/CSF/v2.0
id: https://w3id.org/lmodel/nist-csf-v2
version: 2.0.0
imports:
- linkml:types
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  nist_csf_v2:
    prefix_prefix: nist_csf_v2
    prefix_reference: https://w3id.org/lmodel/nist-csf-v2/
  oscal:
    prefix_prefix: oscal
    prefix_reference: https://w3id.org/lmodel/oscal/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: nist_csf_v2
default_range: string
types:
  csf_function_identifier:
    name: csf_function_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfFunctionIdentifier
    description: The two letters that name one of the six functions, such as GV for
      GOVERN.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)$
  csf_category_identifier:
    name: csf_category_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfCategoryIdentifier
    description: 'A category''s identifier: its function''s letters, a dot and two
      letters for the category, such as GV.OC for Organizational Context.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}$
  csf_subcategory_identifier:
    name: csf_subcategory_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfSubcategoryIdentifier
    description: 'A subcategory''s identifier: its category''s identifier, a hyphen
      and a two-digit number, such as GV.OC-01. CSWP 29 says the numbers are not sequential
      on purpose: a gap marks a CSF 1.1 subcategory that CSF 2.0 moved elsewhere.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}-[0-9]{2}$
  csf_implementation_example_identifier:
    name: csf_implementation_example_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfImplementationExampleIdentifier
    description: 'The identifier NIST''s reference data gives an implementation example:
      its subcategory''s identifier, a dot and a three-digit number, such as GV.OC-01.001.
      The numbers run once through the whole Core, so no two examples share one.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}-[0-9]{2}\.[0-9]{3}$
  csf_element_identifier:
    name: csf_element_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfElementIdentifier
    description: The identifier of a function, a category or a subcategory, whichever
      of the three a withdrawn category names as what incorporated it.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)(\.[A-Z]{2}(-[0-9]{2})?)?$
  csf_category_or_subcategory_identifier:
    name: csf_category_or_subcategory_identifier
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfCategoryOrSubcategoryIdentifier
    description: The identifier of a category or a subcategory, whichever of the two
      a withdrawn subcategory names as what incorporated it.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}(-[0-9]{2})?$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  CsfElementStatus:
    name: CsfElementStatus
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfElementStatus
    description: The state the catalog gives a category or subcategory that CSF 2.0
      no longer carries. A category or subcategory of CSF 2.0 has no status.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://doi.org/10.6028/NIST.CSWP.29
    permissible_values:
      withdrawn:
        text: withdrawn
        description: The element was in CSF 1.1 and CSF 2.0 withdrew it. The catalog
          keeps it, and names where it moved or what incorporated it where NIST recorded
          that.
slots:
  title:
    name: title
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/title
    description: The name CSWP 29 gives the function or category.
    comments:
    - It means what LOKF's title means and carries the same IRI, so lokf adapt folds
      it into LOKF's slot and a knowledge bundle reads one title key.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: CsfCategory
    domain_of:
    - CsfFunction
    - CsfCategory
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/description
    description: What the function, category, subcategory or example says, in the
      words of whoever records it.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: CsfImplementationExample
    domain_of:
    - CsfFunction
    - CsfCategory
    - CsfSubcategory
    - CsfImplementationExample
    range: string
  csfFramework__csf_version:
    name: csfFramework__csf_version
    description: The CSF edition, as NIST numbers it in the publication's title, such
      as 2.0.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:csf_version
    alias: csf_version
    owner: CsfFramework
    domain_of:
    - CsfFramework
    range: string
    required: true
    pattern: ^[0-9]+\.[0-9]+$
  csfFramework__csf_functions:
    name: csfFramework__csf_functions
    description: The six functions, in the order CSWP 29 gives them.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:csf_functions
    alias: csf_functions
    owner: CsfFramework
    domain_of:
    - CsfFramework
    range: CsfFunction
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  csfFunction__csf_function_id:
    name: csfFunction__csf_function_id
    description: The function's two letters, such as GV for GOVERN.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:csf_function_id
    alias: csf_function_id
    owner: CsfFunction
    domain_of:
    - CsfFunction
    range: csf_function_identifier
    required: true
  csfFunction__function_categories:
    name: csfFunction__function_categories
    description: The categories of the function. A knowledge bundle relates a category
      to its function with isPartOf instead.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:function_categories
    alias: function_categories
    owner: CsfFunction
    domain_of:
    - CsfFunction
    range: CsfCategory
    multivalued: true
    inlined: true
    inlined_as_list: true
  csfCategory__csf_category_id:
    name: csfCategory__csf_category_id
    description: The category's identifier, such as GV.OC.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:csf_category_id
    alias: csf_category_id
    owner: CsfCategory
    domain_of:
    - CsfCategory
    range: csf_category_identifier
    required: true
  csfCategory__category_subcategories:
    name: csfCategory__category_subcategories
    description: The subcategories of the category. A knowledge bundle relates a subcategory
      to its category with isPartOf instead.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:category_subcategories
    alias: category_subcategories
    owner: CsfCategory
    domain_of:
    - CsfCategory
    range: CsfSubcategory
    multivalued: true
    inlined: true
    inlined_as_list: true
  csfCategory__category_status:
    name: csfCategory__category_status
    description: withdrawn for a CSF 1.1 category that CSF 2.0 withdrew. A category
      of CSF 2.0 has no status.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:category_status
    alias: category_status
    owner: CsfCategory
    domain_of:
    - CsfCategory
    range: CsfElementStatus
  csfCategory__category_moved_to:
    name: csfCategory__category_moved_to
    description: The CSF 2.0 category a withdrawn category moved to, as the catalog
      states it, such as PR.AA for PR.AC.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:category_moved_to
    alias: category_moved_to
    owner: CsfCategory
    domain_of:
    - CsfCategory
    range: csf_category_identifier
    multivalued: true
  csfCategory__category_incorporated_into:
    name: csfCategory__category_incorporated_into
    description: The function, category or subcategory of CSF 2.0 that took in a withdrawn
      category's outcomes, as the catalog states it, such as GV.OC for ID.BE. The
      catalog names none for some withdrawn categories.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:category_incorporated_into
    alias: category_incorporated_into
    owner: CsfCategory
    domain_of:
    - CsfCategory
    range: csf_element_identifier
    multivalued: true
  csfSubcategory__csf_subcategory_id:
    name: csfSubcategory__csf_subcategory_id
    description: The subcategory's identifier, such as GV.OC-01.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:csf_subcategory_id
    alias: csf_subcategory_id
    owner: CsfSubcategory
    domain_of:
    - CsfSubcategory
    range: csf_subcategory_identifier
    required: true
  csfSubcategory__subcategory_examples:
    name: csfSubcategory__subcategory_examples
    description: The implementation examples NIST publishes for the subcategory. CSWP
      29 says they are notional, that none is required, and that they are not a complete
      list of what could be done.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:subcategory_examples
    alias: subcategory_examples
    owner: CsfSubcategory
    domain_of:
    - CsfSubcategory
    range: CsfImplementationExample
    multivalued: true
    inlined: true
    inlined_as_list: true
  csfSubcategory__subcategory_status:
    name: csfSubcategory__subcategory_status
    description: withdrawn for a CSF 1.1 subcategory that CSF 2.0 withdrew. A subcategory
      of CSF 2.0 has no status.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:subcategory_status
    alias: subcategory_status
    owner: CsfSubcategory
    domain_of:
    - CsfSubcategory
    range: CsfElementStatus
  csfSubcategory__subcategory_moved_to:
    name: csfSubcategory__subcategory_moved_to
    description: The CSF 2.0 subcategory a withdrawn subcategory moved to, as the
      catalog states it, such as GV.OC-03 for ID.GV-03. The catalog names two for
      a few.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    slot_uri: nist_csf_v2:subcategory_moved_to
    alias: subcategory_moved_to
    owner: CsfSubcategory
    domain_of:
    - CsfSubcategory
    range: csf_subcategory_identifier
    multivalued: true
  csfSubcategory__subcategory_incorporated_into:
    name: csfSubcategory__subcategory_incorporated_into
    description: The CSF 2.0 category or subcategory that took in a withdrawn subcategory's
