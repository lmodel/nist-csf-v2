classes:
  CsfFramework:
    name: CsfFramework
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfFramework
    description: 'One edition of the CSF as a whole: its functions, each holding its
      categories and their subcategories.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
    mappings:
    - nist_csf_v2:Framework
    broad_mappings:
    - oscal:Catalog
    slots:
    - csfFramework__csf_version
    - csfFramework__csf_functions
    attributes:
      csf_version:
        name: csf_version
        description: The CSF edition, as NIST numbers it in the publication's title,
          such as 2.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+$
      csf_functions:
        name: csf_functions
        description: The six functions, in the order CSWP 29 gives them.
        range: CsfFunction
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: nist_csf_v2:Framework
    tree_root: true
  CsfFunction:
    name: CsfFunction
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfFunction
    description: 'One of the six functions that sort the CSF''s outcomes at the highest
      level: GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND and RECOVER. Each is named
      by two letters and described in a sentence.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://www.nist.gov/cyberframework
    mappings:
    - nist_csf_v2:Function
    broad_mappings:
    - oscal:Group
    slots:
    - CsfFunction_title
    - description
    - csfFunction__csf_function_id
    - csfFunction__function_categories
    slot_usage:
      title:
        name: title
        required: true
    attributes:
      csf_function_id:
        name: csf_function_id
        description: The function's two letters, such as GV for GOVERN.
        range: csf_function_identifier
        required: true
      function_categories:
        name: function_categories
        description: The categories of the function. A knowledge bundle relates a
          category to its function with isPartOf instead.
        range: CsfCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_csf_v2:Function
  CsfCategory:
    name: CsfCategory
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfCategory
    description: A group of related cybersecurity outcomes within a function, such
      as Organizational Context (GV.OC), or a CSF 1.1 category that CSF 2.0 withdrew,
      which the catalog keeps with its status and, where NIST recorded it, where it
      moved or what incorporated it.
    comments:
    - A withdrawn category keeps its CSF 1.1 subcategories, each withdrawn too, and
      the catalog gives it no statement, so it has no description.
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://www.nist.gov/cyberframework
    mappings:
    - nist_csf_v2:Category
    broad_mappings:
    - oscal:Control
    slots:
    - CsfCategory_title
    - description
    - csfCategory__csf_category_id
    - csfCategory__category_subcategories
    - csfCategory__category_status
    - csfCategory__category_moved_to
    - csfCategory__category_incorporated_into
    slot_usage:
      title:
        name: title
        required: true
    attributes:
      csf_category_id:
        name: csf_category_id
        description: The category's identifier, such as GV.OC.
        range: csf_category_identifier
        required: true
      category_subcategories:
        name: category_subcategories
        description: The subcategories of the category. A knowledge bundle relates
          a subcategory to its category with isPartOf instead.
        range: CsfSubcategory
        multivalued: true
        inlined: true
        inlined_as_list: true
      category_status:
        name: category_status
        description: withdrawn for a CSF 1.1 category that CSF 2.0 withdrew. A category
          of CSF 2.0 has no status.
        range: CsfElementStatus
      category_moved_to:
        name: category_moved_to
        description: The CSF 2.0 category a withdrawn category moved to, as the catalog
          states it, such as PR.AA for PR.AC.
        range: csf_category_identifier
        multivalued: true
      category_incorporated_into:
        name: category_incorporated_into
        description: The function, category or subcategory of CSF 2.0 that took in
          a withdrawn category's outcomes, as the catalog states it, such as GV.OC
          for ID.BE. The catalog names none for some withdrawn categories.
        range: csf_element_identifier
        multivalued: true
    class_uri: nist_csf_v2:Category
  CsfSubcategory:
    name: CsfSubcategory
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfSubcategory
    description: 'A cybersecurity outcome: one statement of a result within a category,
      such as GV.OC-01, or a CSF 1.1 subcategory that CSF 2.0 withdrew, which the
      catalog keeps with its statement, its status and where it moved or what incorporated
      it.'
    comments:
    - 'A subcategory has no title of its own: its identifier names it and its statement
      is its description, which is why the description is required here.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://www.nist.gov/cyberframework
    mappings:
    - nist_csf_v2:Subcategory
    broad_mappings:
    - oscal:Control
    slots:
    - CsfSubcategory_description
    - csfSubcategory__csf_subcategory_id
    - csfSubcategory__subcategory_examples
    - csfSubcategory__subcategory_status
    - csfSubcategory__subcategory_moved_to
    - csfSubcategory__subcategory_incorporated_into
    slot_usage:
      description:
        name: description
        required: true
        pattern: ^\s*\S
    attributes:
      csf_subcategory_id:
        name: csf_subcategory_id
        description: The subcategory's identifier, such as GV.OC-01.
        range: csf_subcategory_identifier
        required: true
      subcategory_examples:
        name: subcategory_examples
        description: The implementation examples NIST publishes for the subcategory.
          CSWP 29 says they are notional, that none is required, and that they are
          not a complete list of what could be done.
        range: CsfImplementationExample
        multivalued: true
        inlined: true
        inlined_as_list: true
      subcategory_status:
        name: subcategory_status
        description: withdrawn for a CSF 1.1 subcategory that CSF 2.0 withdrew. A
          subcategory of CSF 2.0 has no status.
        range: CsfElementStatus
      subcategory_moved_to:
        name: subcategory_moved_to
        description: The CSF 2.0 subcategory a withdrawn subcategory moved to, as
          the catalog states it, such as GV.OC-03 for ID.GV-03. The catalog names
          two for a few.
        range: csf_subcategory_identifier
        multivalued: true
      subcategory_incorporated_into:
        name: subcategory_incorporated_into
        description: The CSF 2.0 category or subcategory that took in a withdrawn
          subcategory's outcome, as the catalog states it, such as GV.OC-01 for ID.BE-02.
        range: csf_category_or_subcategory_identifier
        multivalued: true
    class_uri: nist_csf_v2:Subcategory
  CsfImplementationExample:
    name: CsfImplementationExample
    definition_uri: https://w3id.org/lmodel/nist-csf-v2/CsfImplementationExample
    description: 'An implementation example: one concise, action-oriented step that
      could help achieve a subcategory''s outcome. NIST publishes the examples beside
      the Core, in its reference tool and its catalog, not in CSWP 29 itself.'
    from_schema: https://w3id.org/lmodel/nist-csf-v2
    see_also:
    - https://www.nist.gov/cyberframework
    mappings:
    - nist_csf_v2:ImplementationExample
    broad_mappings:
    - oscal:Part
    slots:
    - CsfImplementationExample_description
    - csfImplementationExample__csf_implementation_example_id
    slot_usage:
      description:
        name: description
        required: true
        pattern: ^\s*\S
    attributes:
      csf_implementation_example_id:
        name: csf_implementation_example_id
        description: The example's identifier in NIST's reference data, such as GV.OC-01.001
          for the first example of subcategory GV.OC-01.
        range: csf_implementation_example_identifier
        required: true
    class_uri: nist_csf_v2:ImplementationExample
