name: Upstream watch

# A weekly check on what this repository is built from but does not
# control: NIST's editions of the Cybersecurity Framework (CSF) and the
# catalog of the pinned edition that NIST publishes in usnistgov/oscal-content.
# Nothing in a pull request can change either, so it runs on a schedule. A
# failing check fails the run and opens an issue, or comments on the one
# already open, so the finding does not depend on anyone reading the run log.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 7 * * 1"  # Mondays at 07:00 UTC, after the knowledge workflows.
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  csf-catalog:
    name: CSF edition and catalog copy are current and intact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open or update the finding's issue
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard library only, so the runner's Python is enough.
      - name: Compare the catalog copy with NIST's releases and editions
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_release.py --report "$RUNNER_TEMP/report.md"

      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream watch: NIST's CSF has changed"
        run: .github/scripts/report-issue.sh
