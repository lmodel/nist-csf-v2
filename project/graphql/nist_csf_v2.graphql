# metamodel_version: 1.7.0
# version: 2.0.0
enum CsfElementStatus
  {
    withdrawn
  }

type CsfCategory
  {
    title: String!
    description: String
    csfCategoryId: CsfCategoryIdentifier!
    categorySubcategories: [CsfSubcategory]
    categoryStatus: CsfElementStatus
    categoryMovedTo: [CsfCategoryIdentifier]
    categoryIncorporatedInto: [CsfElementIdentifier]
  }

type CsfFramework
  {
    csfVersion: String!
    csfFunctions: [CsfFunction]!
  }

type CsfFunction
  {
    title: String!
    description: String
    csfFunctionId: CsfFunctionIdentifier!
    functionCategories: [CsfCategory]
  }

type CsfImplementationExample
  {
    description: String!
    csfImplementationExampleId: CsfImplementationExampleIdentifier!
  }

type CsfSubcategory
  {
    description: String!
    csfSubcategoryId: CsfSubcategoryIdentifier!
    subcategoryExamples: [CsfImplementationExample]
    subcategoryStatus: CsfElementStatus
    subcategoryMovedTo: [CsfSubcategoryIdentifier]
    subcategoryIncorporatedInto: [CsfCategoryOrSubcategoryIdentifier]
  }
