# metamodel_version: 1.7.0
# version: 2.0.0
enum CsfElementStatus
  {
    withdrawn
  }

type CsfCategory
  {
    title: String
    description: String
    categoryId: CsfCategoryIdentifier!
    categorySubcategories: [CsfSubcategory]
    categoryStatus: CsfElementStatus
    categoryMovedTo: [CsfCategoryIdentifier]
    categoryIncorporatedInto: [CsfElementIdentifier]
  }

type CsfFramework
  {
    csfVersion: String!
    functions: [CsfFunction]!
  }

type CsfFunction
  {
    title: String
    description: String
    functionId: CsfFunctionIdentifier!
    functionCategories: [CsfCategory]
  }

type CsfImplementationExample
  {
    description: String!
    implementationExampleId: CsfImplementationExampleIdentifier!
  }

type CsfSubcategory
  {
    description: String!
    subcategoryId: CsfSubcategoryIdentifier!
    subcategoryExamples: [CsfImplementationExample]
    subcategoryStatus: CsfElementStatus
    subcategoryMovedTo: [CsfSubcategoryIdentifier]
    subcategoryIncorporatedInto: [CsfElementIdentifier]
  }
