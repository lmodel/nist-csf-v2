  "classes": {
    "CsfFramework": {
      "name": "CsfFramework",
      "description": "One edition of the CSF as a whole: its functions, each holding its categories and their subcategories.",
      "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
      "see_also": [
        "https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final"
      ],
      "broad_mappings": [
        "oscal:Catalog"
      ],
      "attributes": {
        "csf_version": {
          "name": "csf_version",
          "description": "The CSF edition, as NIST numbers it in the publication's title, such as 2.0.",
          "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
          "owner": "CsfFramework",
          "domain_of": [
            "CsfFramework"
          ],
          "range": "string",
          "required": true,
          "pattern": "^[0-9]+\\.[0-9]+$"
        },
        "csf_functions": {
          "name": "csf_functions",
          "description": "The six functions, in the order CSWP 29 gives them.",
          "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
          "owner": "CsfFramework",
          "domain_of": [
            "CsfFramework"
          ],
          "range": "CsfFunction",
          "required": true,
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true,
          "minimum_cardinality": 1
        }
      },
      "class_uri": "nist_csf_v2:Framework",
      "tree_root": true
    },
    "CsfFunction": {
      "name": "CsfFunction",
      "description": "One of the six functions that sort the CSF's outcomes at the highest level: GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND and RECOVER. Each is named by two letters and described in a sentence.",
      "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
      "see_also": [
        "https://www.nist.gov/cyberframework"
      ],
      "broad_mappings": [
        "oscal:Group"
      ],
      "slots": [
        "csf_function_id",
        "title",
        "description"
      ],
      "slot_usage": {
        "title": {
          "name": "title",
          "required": true
        }
      },
      "attributes": {
        "function_categories": {
          "name": "function_categories",
          "description": "The categories of the function. A knowledge bundle relates a category to its function with isPartOf instead.",
          "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
          "owner": "CsfFunction",
          "domain_of": [
            "CsfFunction"
          ],
          "range": "CsfCategory",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        },
        "csf_function_id": {
          "name": "csf_function_id",
          "description": "The function's two letters, such as GV for GOVERN.",
          "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
          "owner": "CsfFunction",
          "domain_of": [
            "CsfFunction"
          ],
          "range": "csf_function_identifier",
          "required": true
        },
        "title": {
          "name": "title",
          "description": "The name CSWP 29 gives the function or category.",
          "comments": [
            "It means what LOKF's title means and carries the same IRI, so lokf adapt folds it into LOKF's slot and a knowledge bundle reads one title key."
          ],
          "from_schema": "https://w3id.org/lmodel/nist-csf-v2",
          "slot_uri": "schema:name",
          "owner": "CsfFunction",
          "domain_of": [
            "CsfFunction",
            "CsfCategory"
          ],
          "range": "string",
          "required": true
        },
        "description": {
