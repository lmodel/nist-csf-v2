# Category GV.OC with one of its subcategories inlined, as the framework
# document holds it. The descriptions paraphrase CSWP 29.
csf_category_id: GV.OC
title: Organizational Context
description: >-
  The organization understands the circumstances that surround its
  cybersecurity risk decisions: its mission, what its stakeholders expect,
  what it depends on, and the legal, regulatory and contractual requirements
  it is under.
category_subcategories:
  - csf_subcategory_id: GV.OC-02
    description: >-
      The organization understands its internal and external stakeholders
      and takes their needs and expectations into account.
